<!doctype html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Projekti mjesne zajednice</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- Bootstrap ikone -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Dodatni stil aplikacije -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- GLAVNO ZAGLAVLJE -->
<header class="hero-section">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-lg-8">
                <small class="hero-label">
                    TRANSPARENTNO FINANSIRANJE
                </small>

                <h1 class="display-5 fw-bold mt-2 mb-2">
                    Razvojni projekti Hajvaza
                </h1>

                <p class="mb-0 text-white-50">
                    Pregled realizovanih projekata, prihoda i troškova zajednice.
                </p>
            </div>

            <div class="col-lg-4 text-lg-end mt-4 mt-lg-0">
                <button
                    type="button"
                    class="btn btn-light text-success fw-semibold px-4 py-3 shadow-sm"
                    onclick="openModal('projectModal')"
                >
                    <i class="bi bi-plus-circle me-2"></i>
                    Novi projekat
                </button>
            </div>

        </div>
    </div>
</header>


<!-- GLAVNI SADRŽAJ -->
<main class="container py-5">

    <!--
        Ovaj dio automatski popunjava app.js.
        Prikazuje ukupne prihode, rashode i saldo.
    -->
    <section
        id="stats"
        class="row g-3 mb-5"
        aria-label="Ukupna finansijska statistika"
    ></section>


    <!-- AKTUELNI PROJEKTI -->
    <section>

        <div class="row align-items-end mb-4">

            <div class="col-md-7">
                <small class="section-label">PREGLED</small>

                <h2 class="fw-bold mb-0">
                    Aktuelni projekti
                </h2>
            </div>

            <div class="col-md-5 mt-3 mt-md-0">
                <div class="search-box ms-md-auto">
                    <i class="bi bi-search"></i>

                    <input
                        type="search"
                        id="search"
                        class="form-control"
                        placeholder="Pretraži projekte..."
                        autocomplete="off"
                        aria-label="Pretraži projekte"
                    >
                </div>
            </div>

        </div>

        <!--
            Kartice projekata automatski pravi funkcija render()
            koja se nalazi u app.js.
        -->
        <div id="projects" class="row g-4"></div>

    </section>

</main>


<!-- MODAL: NOVI PROJEKAT -->
<dialog id="projectModal">

    <form id="projectForm">

        <div class="dialog-header d-flex justify-content-between align-items-start">

            <div>
                <h2 class="h4 fw-bold mb-1">
                    Novi projekat
                </h2>

                <p class="small text-secondary mb-0">
                    Unesite osnovne informacije o projektu.
                </p>
            </div>

            <button
                type="button"
                class="btn-close"
                aria-label="Zatvori"
                onclick="closeModal('projectModal')"
            ></button>

        </div>


        <div class="dialog-body">

            <div class="mb-3">
                <label for="naziv" class="form-label">
                    Naziv projekta
                </label>

                <input
                    type="text"
                    id="naziv"
                    name="naziv"
                    class="form-control"
                    placeholder="Npr. Uređenje dječijeg igrališta"
                    required
                >
            </div>


            <div class="mb-3">
                <label for="opis" class="form-label">
                    Opis projekta
                </label>

                <textarea
                    id="opis"
                    name="opis"
                    class="form-control"
                    rows="3"
                    placeholder="Kratko opišite projekat..."
                ></textarea>
            </div>


            <div class="row g-3 mb-3">

                <div class="col-md-6">
                    <label for="datum_pocetka" class="form-label">
                        Datum početka
                    </label>

                    <input
                        type="date"
                        id="datum_pocetka"
                        name="datum_pocetka"
                        class="form-control"
                        required
                    >
                </div>

                <div class="col-md-6">
                    <label for="datum_zavrsetka" class="form-label">
                        Planirani završetak
                    </label>

                    <input
                        type="date"
                        id="datum_zavrsetka"
                        name="datum_zavrsetka"
                        class="form-control"
                    >
                </div>

            </div>


            <div class="row g-3 mb-3">

                <div class="col-md-4">
                    <label for="cilj" class="form-label">
                        Ciljani iznos
                    </label>

                    <input
                        type="number"
                        id="cilj"
                        name="cilj"
                        class="form-control"
                        min="0"
                        step="0.01"
                        placeholder="0,00"
                    >
                </div>

                <div class="col-md-4">
                    <label for="valuta" class="form-label">
                        Valuta projekta
                    </label>

                    <select
                        id="valuta"
                        name="valuta"
                        class="form-select"
                        required
                    >
                        <option value="BAM">
                            KM – Konvertibilna marka
                        </option>
                        <option value="EUR">
                            € – Euro
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="status" class="form-label">
                        Status projekta
                    </label>

                    <select
                        id="status"
                        name="status"
                        class="form-select"
                    >
                        <option value="planiran">Planiran</option>
                        <option value="aktivan">Aktivan</option>
                        <option value="zavrsen">Završen</option>
                        <option value="obustavljen">Obustavljen</option>
                    </select>
                </div>

            </div>


            <div class="row g-3">

                <div class="col-md-6">
                    <label for="odgovorna_osoba" class="form-label">
                        Odgovorna osoba
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            id="odgovorna_osoba"
                            name="odgovorna_osoba"
                            class="form-control"
                            placeholder="Ime i prezime"
                            required
                        >
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="kontakt" class="form-label">
                        Kontakt broj
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-telephone"></i>
                        </span>

                        <input
                            type="tel"
                            id="kontakt"
                            name="kontakt"
                            class="form-control"
                            placeholder="061 123 456"
                            required
                        >
                    </div>
                </div>

            </div>

        </div>


        <div class="dialog-footer">

            <button
                type="button"
                class="btn btn-light border"
                onclick="closeModal('projectModal')"
            >
                Odustani
            </button>

            <button type="submit" class="btn btn-success px-4">
                <i class="bi bi-check-circle me-2"></i>
                Sačuvaj projekat
            </button>

        </div>

    </form>

</dialog>


<!--
    MODAL: DETALJNI PREGLED PROJEKTA

    Sadržaj ovog elementa automatski pravi funkcija details()
    iz app.js na osnovu projekta, donacija i rashoda iz baze.
-->
<dialog id="detailModal" class="wide">
    <div id="detail"></div>
</dialog>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
></script>

<!-- JavaScript aplikacije -->
 <script src="app_ascii.js?v=1"></script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
